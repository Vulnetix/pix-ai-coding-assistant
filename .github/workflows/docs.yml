name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      # The skills, agents and hook table are the source for four of the docs
      # directories, so a change to them is a change to the site.
      - "skills/**"
      - "vulnetix/agents/**"
      - "scripts/gen-docs.mjs"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "website/**"
      - "skills/**"
      - "vulnetix/agents/**"
      - "scripts/gen-docs.mjs"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0

      # Fails if the generated pages have drifted from the skills, agents and
      # hook table they are a projection of. This is the check that did not
      # exist, which is why _index.md claimed "Six hooks, Six skills, Four
      # commands, 28 agents" against 14/33/59/41 on disk.
      - name: Check the generated docs are current
        run: node scripts/gen-docs.mjs --check

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22"

      - name: Build Hugo site
        working-directory: website
        run: |
          hugo mod get
          hugo --minify

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/public
          retention-days: 1

  deploy:
    needs: build
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
