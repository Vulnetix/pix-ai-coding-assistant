name: Evals

on:
  pull_request:
    paths:
      - "skills/**"
      - "scripts/eval*.mjs"
      - ".github/workflows/evals.yml"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "scripts/eval*.mjs"
  # The agent-driven layers cost money and minutes, so they are deliberate.
  workflow_dispatch:
    inputs:
      agents:
        description: "Comma-separated agents to drive (claude, codex). Empty runs corpus checks only."
        required: false
        default: ""
  schedule:
    # Weekly, so a change in agent behaviour or VDB data surfaces on its own
    # rather than the next time somebody happens to look.
    - cron: "17 4 * * 1"

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corpus:
    name: Corpus
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # The shared fixture: a deliberately vulnerable multi-ecosystem tree whose
      # expected.json pins the CVEs, the KEV member and the manifest line each
      # package anchors to. Ground-truth assertions are checked against it rather
      # than against a judge, so a hallucinated CVE fails instead of being talked
      # through.
      #
      # Its own repository, not a sparse checkout of the CLI: it is a submodule
      # there, so checking out that path without submodules gets an empty folder
      # and every ground-truth assertion silently has nothing to assert against.
      #
      # It is private, so this needs a token. continue-on-error because a missing
      # secret should degrade the run, not fail it — the structural checks are
      # the valuable per-push gate and need no fixture, and eval.mjs reports what
      # it skipped.
      - name: Check out the fixture
        id: fixture
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: Vulnetix/vulnetix-fixture-app
          path: .fixture-repo
          token: ${{ secrets.GH_MODULES_PAT }}

      # No model, no credential, no cost. This is the layer that catches an eval
      # asserting on behaviour that was removed, or naming a CVE the fixture does
      # not contain — the drift that made the previous corpus dormant.
      - name: Validate the corpus
        env:
          VULNETIX_FIXTURE: ${{ github.workspace }}/.fixture-repo
        run: node scripts/eval.mjs

  agents:
    name: Agent-driven
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: corpus
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    permissions:
      contents: read
    steps:
      # The fixture is private and needs GH_MODULES_PAT. Without it this job
      # cannot assert anything, and running the agents anyway costs money to
      # prove nothing, so skip visibly instead of failing every scheduled run.
      - name: Require the fixture token
        id: gate
        env:
          FIXTURE_TOKEN: ${{ secrets.GH_MODULES_PAT }}
        run: |
          if [ -z "$FIXTURE_TOKEN" ]; then
            echo "::warning::GH_MODULES_PAT is not set on this repository; agent-driven evals skipped"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.skip != 'true'

      # Not continue-on-error here: the agent-driven layers assert against the
      # fixture's ground truth, so without it this job would run at full cost
      # and prove considerably less.
      - name: Check out the fixture
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v5
        with:
          repository: Vulnetix/vulnetix-fixture-app
          path: .fixture-repo
          token: ${{ secrets.GH_MODULES_PAT }}

      - name: Install the CLI
        if: steps.gate.outputs.skip != 'true'
        run: curl -fsSL https://cli.vulnetix.com/install.sh | sh

      - name: Wire the agents on this runner
        if: steps.gate.outputs.skip != 'true'
        run: vulnetix agent install

      # Trigger and ground-truth layers. `--agents` with no value drives every
      # agent found on the runner; the dispatch input narrows it.
      - name: Run the evals
        if: steps.gate.outputs.skip != 'true'
        env:
          VULNETIX_FIXTURE: ${{ github.workspace }}/.fixture-repo
          VULNETIX_API_KEY: ${{ secrets.VULNETIX_API_KEY }}
          VULNETIX_ORG_ID: ${{ secrets.VULNETIX_ORG_ID }}
        run: |
          if [ -n "${{ inputs.agents }}" ]; then
            node scripts/eval.mjs --agents="${{ inputs.agents }}"
          else
            node scripts/eval.mjs --agents
          fi

      # Same harness, second consumer: the frames the marketing pages animate
      # come out of the runs that just had to pass their assertions.
      - name: Record the demos
        if: steps.gate.outputs.skip != 'true'
        env:
          VULNETIX_FIXTURE: ${{ github.workspace }}/.fixture-repo
        run: node scripts/record-demos.mjs

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          name: agent-replays
          path: recordings/
          if-no-files-found: warn
          retention-days: 7
