name: Validate Skills
on:
  pull_request:
    paths:
      - "skills/**"
      - ".pre-commit-config.yaml"
      - ".github/workflows/skill-validator.yml"

concurrency:
  group: skill-validator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      # The release binary, not Homebrew: the self-hosted runner has no brew.
      # The version is pinned and the download checked against the release's
      # own checksums.
      - name: Install skill-validator
        env:
          SKILL_VALIDATOR_VERSION: "1.8.0"
        run: |
          set -euo pipefail
          base="https://github.com/agent-ecosystem/skill-validator/releases/download/v${SKILL_VALIDATOR_VERSION}"
          archive="skill-validator_${SKILL_VALIDATOR_VERSION}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 8 --retry-max-time 300 --retry-all-errors -O "$base/$archive" -O "$base/skill-validator_${SKILL_VALIDATOR_VERSION}_checksums.txt"
          grep " $archive\$" "skill-validator_${SKILL_VALIDATOR_VERSION}_checksums.txt" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$archive" -C "$HOME/.local/bin" skill-validator
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Canonical skills live at skills/ in the repository root — the convention
      # `gh skill publish` and `npx skills add` both look for. vulnetix/skills,
      # .claude/skills and .agents/skills are symlinks to it, so validating the
      # real directory validates every path into it exactly once.
      - name: Validate skills
        run: |
          skill-validator check --strict --allow-extra-frontmatter --allow-dirs=evals,references --emit-annotations skills/
          skill-validator check --strict --allow-extra-frontmatter --allow-dirs=evals,references -o markdown skills/ >> "$GITHUB_STEP_SUMMARY"

      # The same spec, checked by the tool that publishes against it. This is
      # what catches a frontmatter key the validator tolerates and the registry
      # does not.
      - name: Check the publishable form
        run: gh skill publish --dry-run
        env:
          GH_TOKEN: ${{ github.token }}
