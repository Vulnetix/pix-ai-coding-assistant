name: Validate Skills
on:
  pull_request:
    paths:
      - "skills/**"
      - ".pre-commit-config.yaml"
      - ".github/workflows/skill-validator.yml"

concurrency:
  group: skill-validator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5.1.0

      - name: Install skill-validator
        run: brew install agent-ecosystem/tap/skill-validator

      # Canonical skills live at skills/ in the repository root — the convention
      # `gh skill publish` and `npx skills add` both look for. vulnetix/skills,
      # .claude/skills and .agents/skills are symlinks to it, so validating the
      # real directory validates every path into it exactly once.
      - name: Validate skills
        run: |
          skill-validator check --strict --allow-extra-frontmatter --allow-dirs=evals,references --emit-annotations skills/
          skill-validator check --strict --allow-extra-frontmatter --allow-dirs=evals,references -o markdown skills/ >> "$GITHUB_STEP_SUMMARY"

      # The same spec, checked by the tool that publishes against it. This is
      # what catches a frontmatter key the validator tolerates and the registry
      # does not.
      - name: Check the publishable form
        run: gh skill publish --dry-run
        env:
          GH_TOKEN: ${{ github.token }}
